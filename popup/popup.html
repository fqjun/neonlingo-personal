<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>NeonLingo 个人版</title>
    <link rel="stylesheet" href="../common/ui.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="row">
      <img src="../icons/icon48.png" width="24" height="24" alt="" />
      <h1>NeonLingo <span class="muted small">个人版</span></h1>
    </header>

    <div id="keyNotice" class="notice" hidden>还没有配置模型 API。<a href="#" data-open="options">去设置</a></div>

    <section class="stats">
      <div><b id="sNew">0</b><span>今日新词</span></div>
      <div><b id="sLearning">0</b><span>学习中</span></div>
      <div><b id="sMastered">0</b><span>已掌握</span></div>
      <div><b id="sReplaced">0</b><span>今日替换</span></div>
    </section>

    <section class="panel">
      <label class="switch"><span>启用沉浸式学习</span><input type="checkbox" id="enabled" /></label>
      <label class="switch"><span>在 <b id="host">本站</b> 启用</span><input type="checkbox" id="siteOn" /></label>
    </section>

    <section class="panel">
      <label class="field"><span>当前外语水平</span><select id="level"></select></label>
      <p class="muted small level-desc" id="levelDesc"></p>
      <label class="field"
        ><span>词汇量 <span class="muted small" id="effVocab"></span></span><input type="number" id="vocabSize" min="300" max="30000" step="100"
      /></label>
      <div class="field">
        <span class="muted small">想学的单词难度</span>
        <div class="seg" id="wordDifficulty">
          <button data-v="review">轻松巩固</button><button data-v="next">稍有挑战</button><button data-v="challenge">更有挑战</button>
        </div>
        <span class="muted small" id="difficultyDesc"></span>
      </div>
      <div class="field">
        <span class="muted small">替换密度</span>
        <div class="seg" id="density">
          <button data-v="low">少 2%</button><button data-v="medium">中 5%</button><button data-v="high">多 8%</button>
        </div>
      </div>
    </section>

    <section class="panel">
      <label class="switch"
        ><span
          >查词后自动收藏<br /><span class="muted small"
            >你查过的单词会加入单词本并用颜色提示。关闭此项，不影响上方自动识别的词加入单词本。</span
          ></span
        ><input type="checkbox" id="autoSaveLookup"
      /></label>
    </section>

    <div class="actions">
      <button class="primary" data-open="review">复习 <span id="sDue" class="badge">0</span></button>
      <button data-open="vocab">生词本</button>
      <button data-open="options">设置</button>
    </div>
    <p class="muted small" id="usage"></p>

    <script type="module" src="popup.js"></script>
  </body>
</html>
